[package]
name = "spin-filesystem-object-store"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
async-once-cell = "0.5.4"
async-trait = { workspace = true }
# The same aws-config flags as spin-key-value-aws: no default HTTPS client,
# credential sources beyond the basics enabled explicitly.
aws-config = { version = "1.1.7", default-features = false, features = [
  "rt-tokio",
  "credentials-process",
  "sso",
] }
aws-credential-types = "1.1.7"
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
object_store = { version = "0.12", features = ["aws"] }
serde = { workspace = true }
spin-factor-filesystem = { path = "../factor-filesystem" }
tracing = { workspace = true }

[dev-dependencies]
spin-factor-filesystem = { path = "../factor-filesystem", features = [
  "conformance",
] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
toml = { workspace = true }

[lints]
workspace = true
